<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Cà phê Vỉa Hè</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<style>

*{box-sizing:border-box}
body{margin:0;background:#241810;color:var(--ink);font-family:Georgia,serif;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}

#join h1{margin:0;font-size:26px;color:var(--green)}#join p{margin:0}
#join input{font:16px sans-serif;padding:8px;border:2px solid var(--ink);background:#fff8e6}
.sw{display:flex;gap:6px}.sw i{width:26px;height:26px;border:2px solid var(--ink);cursor:pointer}.sw i.on{outline:3px solid var(--red)}
#err{color:var(--red);min-height:1em;font-size:14px}
@media (max-width:720px),(max-height:520px){
 body{height:auto;min-height:100vh;overflow:auto;justify-content:flex-start}
 #wrap{width:min(100vw,calc(62vh*1.6))}

 #bar{width:100%;height:auto;flex-wrap:wrap;padding:6px}
 #msg{flex:1 1 55%;height:42px;font-size:16px}

 #menu{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:62vh;overflow:auto;z-index:5}
 #wq{position:fixed;bottom:72px;z-index:6}
 #join{position:fixed;z-index:9}
 #log{width:75%;font-size:11px}
 #dz{top:30%;font-size:15px;padding:12px 14px}
}
</style></head><body>

<div id="join"><div class="c"><h1>Cà phê Vỉa Hè</h1><p>Ghế nhựa thấp, trà đá, phố cổ nhìn ra đường. Bạn tên gì?</p>

<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=960,H=600,$=id=>document.getElementById(id);
const EMO=['❤️','😂','👍','🍻','😴'],COLS=['#3b7dd8','#d8543b','#3fa56b','#e0a030','#8e5bb5','#2a2a2a'];
let ws,me=null,menu=[],P=new Map(),keys={},tgt=null,sitOn=false,col=COLS[0],sent='';
const TABLES=[[190,300],[420,300],[650,300],[860,300],[300,440],[540,440],[780,440]],STOOLS=[];
TABLES.forEach(([x,y])=>[[-30,0],[30,0],[0,-26],[0,26]].forEach(([a,b])=>STOOLS.push([x+a,y+b])));

const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){const c=bg.getContext('2d'),cols=['#d9a441','#c98b4f','#e3c07a','#b7bf9c','#d68f6a'],sg=['PHỞ BÒ','HIỆU THUỐC','CÀ PHÊ','TẠP HÓA','BÚN CHẢ','MAY ĐO'];
 c.fillStyle='#e8d5a8';c.fillRect(0,0,W,90);
 for(let x=0,i=0;x<W;i++){const w=110+(i*37)%50;
  c.fillStyle=cols[i%5];c.fillRect(x,18,w,72);c.fillStyle='#7a3328';c.fillRect(x-2,8,w+4,11);
  c.fillStyle='#f3e3c3';c.fillRect(x+8,22,w-16,12);c.fillStyle='#3b2616';c.font='bold 9px sans-serif';c.textAlign='center';c.fillText(sg[i%6],x+w/2,31);
  for(let k=0;k<2;k++){const wx=x+12+k*(w/2-4);c.fillStyle='#4f7a5a';c.fillRect(wx,38,24,32);c.fillStyle='#2a1c12';c.fillRect(wx+4,42,16,24)}
  c.fillStyle='#6b2d24';c.fillRect(x+w/2-16,72,32,18);x+=w}
 c.strokeStyle='#1a1a1a';c.lineWidth=1;[6,14,22].forEach((y,i)=>{c.beginPath();c.moveTo(0,y);c.quadraticCurveTo(W/2,y+16+i*4,W,y);c.stroke()});
 c.fillStyle='#4d4a47';c.fillRect(0,90,W,90);c.fillStyle='#ddd';for(let x=0;x<W;x+=60)c.fillRect(x,133,30,3);
 c.fillStyle='#a89a86';c.fillRect(0,180,W,12);
 for(let y=192,r=0;y<H;y+=40,r++)for(let x=0,k=0;x<W;x+=40,k++){c.fillStyle=(r+k)%2?'#cdbd9f':'#bfae8f';c.fillRect(x,y,40,40)}
 c.fillStyle='#2f5d46';c.fillRect(16,204,250,26);c.fillStyle='#f3e3c3';c.font='bold 16px Georgia';c.textAlign='center';c.fillText('Cà phê Vỉa Hè · Phố Cổ',141,222);
 TABLES.forEach(([x,y])=>{c.fillStyle='#8c5a36';c.beginPath();c.arc(x,y,17,0,7);c.fill();c.fillStyle='#b9854f';c.beginPath();c.arc(x,y-2,15,0,7);c.fill()});
 STOOLS.forEach(([x,y],i)=>{c.fillStyle=i%3?'#c0392b':'#2f6fb5';c.beginPath();c.arc(x,y,9,0,7);c.fill();c.fillStyle='rgba(255,255,255,.3)';c.beginPath();c.arc(x-2,y-2,4,0,7);c.fill()});
 c.fillStyle='#5e3a1f';c.fillRect(20,520,230,65);c.fillStyle='#8a5a30';c.fillRect(20,520,230,12);c.fillStyle='#f3e3c3';c.font='bold 13px Georgia';c.fillText('QUẦY · gọi món (M)',135,556);
 c.fillStyle='#3d3d3d';c.fillRect(180,498,58,28);c.fillStyle='#9bd6a3';c.fillRect(186,502,24,9);c.fillStyle='#c9c9c9';for(let i=0;i<6;i++)c.fillRect(216+(i%3)*7,502+(i>>1&1)*0+((i/3|0)*7),5,5);c.fillStyle='#222';c.fillRect(180,520,58,6);c.fillStyle='#d9b84a';c.fillRect(200,521,18,3);
 [[960-30,250],[30,400]].forEach(([x,y])=>{c.fillStyle='#8a4b2a';c.fillRect(x-10,y,20,16);c.fillStyle='#3d8a4f';[[-8,-6],[0,-14],[8,-6]].forEach(([a,b])=>{c.beginPath();c.arc(x+a,y+b,9,0,7);c.fill()})});
})();
// ---- xe cộ & người đi bộ (chỉ là cảnh nền, mỗi máy tự chạy)
const veh=[],peds=[];let vt=0,pt=0;
const rnd=a=>a[Math.random()*a.length|0];
function update(dt){
 vt-=dt;if(vt<0&&veh.length<14){vt=.5+Math.random()*1.3;const d=Math.random()<.5?1:-1,r=Math.random();
  veh.push({x:d>0?-60:W+60,y:d>0?150+Math.random()*8:108+Math.random()*10,d,v:(70+Math.random()*110)*d,k:r<.65?0:r<.85?1:2,c:rnd(['#c0392b','#2c6fbb','#222','#e0a030','#3a8f5c']),s:rnd(['#e8e8e8','#d8543b','#3b7dd8','#f0c040']),h:Math.random()<.5})}
 pt-=dt;if(pt<0&&peds.length<9){pt=1+Math.random()*2.5;const d=Math.random()<.5?1:-1;peds.push({x:d>0?-20:W+20,y:182+Math.random()*10,d,v:(25+Math.random()*30)*d,k:Math.random()<.25?1:0,c:rnd(['#a8362a','#2f5d46','#e0a030','#7a7a7a','#4a6fa5'])})}
 for(const a of [veh,peds]){for(let i=a.length-1;i>=0;i--){const o=a[i];o.x+=o.v*dt;if(o.x<-80||o.x>W+80)a.splice(i,1)}}
 if(me&&!me.stn&&document.activeElement.tagName!=='INPUT'){let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);
  if(dx||dy){tgt=null;me.sit=0;const l=Math.hypot(dx,dy);me.x+=dx/l*170*dt;me.y+=dy/l*170*dt}
  else if(tgt){const ex=tgt[0]-me.x,ey=tgt[1]-me.y,l=Math.hypot(ex,ey);if(l<4){me.x=tgt[0];me.y=tgt[1];me.sit=sitOn?1:0;tgt=null}else{me.sit=0;me.x+=ex/l*170*dt;me.y+=ey/l*170*dt}}
  me.x=Math.max(20,Math.min(940,me.x));me.y=Math.max(235,Math.min(580,me.y));me.rx=me.x;me.ry=me.y}
 P.forEach(p=>{if(p!==me){p.rx+=(p.x-p.rx)*.25;p.ry+=(p.y-p.ry)*.25}});
 for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.g)f.vy+=420*dt;f.l-=dt;if(f.l<=0)FX.splice(i,1)}
 shake=Math.max(0,shake-dt);
}
function drawVeh(o){g.save();g.translate(o.x,o.y);g.scale(o.d,1);
 const hat=()=>{g.fillStyle='#d8c27a';g.beginPath();g.moveTo(-9,-33);g.lineTo(-1,-43);g.lineTo(7,-33);g.fill()};
 g.fillStyle='#111';if(o.k===0){[-14,14].forEach(x=>{g.beginPath();g.arc(x,0,7,0,7);g.fill()});g.fillStyle=o.c;g.fillRect(-12,-12,26,8);g.fillRect(12,-20,3,10);}
 else{g.strokeStyle='#111';g.lineWidth=2;[-12,12].forEach(x=>{g.beginPath();g.arc(x,0,8,0,7);g.stroke()});g.strokeStyle=o.c;g.beginPath();g.moveTo(-12,0);g.lineTo(0,-12);g.lineTo(12,0);g.moveTo(0,-12);g.lineTo(10,-18);g.stroke();
  if(o.k===2){['#e8556d','#f0c040','#fff','#e8556d'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(14+i*3,-22-(i%2)*4,4,0,7);g.fill()})}}
 g.fillStyle=o.s;g.fillRect(-6,-27,10,15);g.fillStyle='#e8b88a';g.beginPath();g.arc(-1,-31,5,0,7);g.fill();if(o.h)hat();g.restore()}
function drawPed(o,t){g.save();g.translate(o.x,o.y);g.scale(o.d,1);const s=Math.sin(t/160+o.x)*5;
 g.strokeStyle='#2a1c12';g.lineWidth=3;g.beginPath();g.moveTo(-2,-4);g.lineTo(-2+s,4);g.moveTo(2,-4);g.lineTo(2-s,4);g.stroke();
 g.fillStyle=o.c;g.fillRect(-5,-20,10,17);g.fillStyle='#e8b88a';g.beginPath();g.arc(0,-25,5,0,7);g.fill();
 g.fillStyle='#d8c27a';g.beginPath();g.moveTo(-9,-27);g.lineTo(0,-36);g.lineTo(9,-27);g.fill();
 if(o.k){g.strokeStyle='#6b4a2a';g.lineWidth=2;g.beginPath();g.moveTo(-24,-18);g.lineTo(24,-18);g.stroke();['#e8556d','#3fa56b'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(i?22:-22,-8,7,0,7);g.fill()})}g.restore()}
const FX=[],LIT=[];let CAM={z:1,x:0,y:0},pd=0,shake=0,AC,dzT=0,dzH,till=0,wname='';
function pipe(x,y){g.save();g.translate(x,y);g.rotate(-.45);
 g.fillStyle='#b39a3c';g.fillRect(-4,-15,8,30);g.fillStyle='#8a742a';g.fillRect(-4,-15,2,30);
 g.fillStyle='#5e4d18';[-9,2,11].forEach(j=>g.fillRect(-5,j,10,2));
 g.fillStyle='#2a1c12';g.fillRect(-2,-21,4,7);
 g.fillStyle='#6b6b6b';g.fillRect(3,-9,6,3);g.fillStyle='#9a9a9a';g.beginPath();g.ellipse(10,-10,4.5,3,0,0,7);g.fill();
 g.fillStyle='#e8622a';g.beginPath();g.arc(10,-11,1.7,0,7);g.fill();g.restore()}
function drawItem(p,x,y){if(p.item===14)pipe(x,y-2);else{g.font='18px serif';g.textAlign='center';g.fillStyle='#000';g.fillText(menu[p.item].e,x,y)}const mx=p.item<6||p.item===12?4:6;for(let i=0;i<mx;i++){g.fillStyle=i<p.lvl?(p.item===12?'#ff9d2e':'#ffd98a'):'rgba(0,0,0,.35)';g.fillRect(x-mx*2+i*4,y+5,3,3)}}
function snd(k){try{AC=AC||new AudioContext();const t=AC.currentTime,o=AC.createOscillator(),n=AC.createGain();o.connect(n);n.connect(AC.destination);
 const S={crack:['square',900,300,.06,.08],drink:['sine',320,110,.3,.12],smash:['sawtooth',2400,70,.4,.15],put:['triangle',1300,800,.08,.1],smoke:['sine',180,90,.5,.06],thud:['square',160,50,.14,.2],whiff:['sine',500,300,.1,.04]}[k];
 o.type=S[0];o.frequency.setValueAtTime(S[1],t);o.frequency.exponentialRampToValueAtTime(S[2],t+S[3]);n.gain.setValueAtTime(S[4],t);n.gain.exponentialRampToValueAtTime(.001,t+S[3]+.02);o.start(t);o.stop(t+S[3]+.03)}catch(e){}}
function fx(m,t){const p=P.get(m.id);if(!p||!me)return;const near=Math.hypot(p.rx-me.rx,p.ry-me.ry)<320,cx=p.px>=0?p.px:p.rx+14,cy=p.px>=0?p.py:p.ry-8;
 if(m.a==='drink'){p.anim=['drink',t+900];if(near)snd('drink')}
 else if(m.a==='smoke'){p.anim=['smoke',t+1300];for(let i=0;i<9;i++)FX.push({x:p.rx+5+Math.random()*4,y:p.ry-18,vx:8+Math.random()*28,vy:-18-Math.random()*26,l:2.2+Math.random(),c:'#d9d9d9',r:4+Math.random()*5});if(near)snd('smoke')}
 else if(m.a==='pour'){p.anim=['pour',t+800];for(let i=0;i<14;i++)FX.push({x:p.rx-14+i*1.5,y:p.ry-8+i*1.2,vx:10+Math.random()*10,vy:10+i*2,l:.7,c:'#ff9d2e',s:3,g:1});if(near)snd('drink')}
 else if(m.a==='whack'){p.anim=['whack',t+300];const v=P.get(m.to);if(v){v.anim=['hit',t+500];for(let i=0;i<4;i++)FX.push({txt:'💫',x:v.rx+(Math.random()-.5)*20,y:v.ry-40,vx:(Math.random()-.5)*40,vy:-30,l:.9,c:'#fff'});FX.push({txt:'BỐP!',x:v.rx,y:v.ry-52,vx:0,vy:-25,l:.8,c:'#a8362a'});if(near)snd('thud')}else if(near)snd('whiff')}
 else if(m.a==='crack'){p.anim=['crack',t+400];for(let i=0;i<3;i++)FX.push({x:p.rx+6,y:p.ry-16,vx:(Math.random()-.5)*60,vy:-20-Math.random()*30,l:1,c:'#3a2a1a',s:3,g:1});
  LIT.push({x:p.rx+(Math.random()-.5)*28,y:p.ry+8+Math.random()*8,tt:t+40000});if(LIT.length>120)LIT.shift();if(near)snd('crack')}
 else if(m.a==='smash'){for(let i=0;i<20;i++)FX.push({x:cx,y:cy,vx:(Math.random()-.5)*280,vy:-60-Math.random()*170,l:1.4,c:rnd(['#cfeaff','#fff','#9fd0f0']),s:2+Math.random()*3,g:1});
  FX.push({txt:'CHOANG!',x:cx,y:cy-22,vx:0,vy:-30,l:1.2,c:'#a8362a'});if(near){shake=.3;snd('smash')}}}
function putPos(){let b=null,bd=75;TABLES.forEach(([x,y])=>{const d=Math.hypot(x-me.x,y-me.y);if(d<bd){bd=d;b=[x,y]}});return b?[b[0]+((me.id%4)-1.5)*9,b[1]-2]:[me.x+12,me.y+14]}
function near(r){let o=null,bd=r;P.forEach(q=>{if(q!==me){const d=Math.hypot(q.rx-me.rx,q.ry-me.ry);if(d<bd){bd=d;o=q}}});return o}
function doAct(a){if(!me||!ws)return;const hint=s=>log('',s,1),I=me.item,S=o=>ws.send(JSON.stringify({t:'act',...o}));
 if(me.stn)return hint('Bạn đang choáng, nằm im đã');
 if(a==='whisper'){if(wname)return ws.send(JSON.stringify({t:'wend'}));const o=near(110);return o?ws.send(JSON.stringify({t:'wreq',to:o.id})):hint('Lại gần một người rồi bấm N để xin nói chuyện riêng')}
 if(a==='hire'){if(me.role!==2)return hint('Chỉ chủ quán mới thuê được nhân viên');const o=near(150);return o?S({a,to:o.id}):hint('Đứng gần người muốn thuê hoặc cho nghỉ')}
 if(a==='till'){if(Math.hypot(me.x-208,me.y-540)>110)return hint('Lại gần quầy tính tiền (két ở góc quầy)');return S({a})}
 if(['serve','zen','draw'].includes(a)){if(me.role!==1)return hint('Chỉ nhân viên mới làm được (chủ quán thuê bạn bằng Y)');return S({a})}
 if(a==='chui'){const o=near(200);return S({a,to:o?o.id:0})}
 if(I<0&&a!=='pour')return hint('Bạn chưa gọi món nào, bấm M để mở menu');
 if(a!=='pour'&&me.px>=0&&Math.hypot(me.px-me.x,me.py-me.y)>90)return hint('Món đang để ở bàn xa, đi lại gần nhé');
 if(a==='put'){if(me.px>=0)S({a:'take'});else{const q=putPos();S({a,x:q[0],y:q[1]});snd('put')}return}
 if(a==='drink'&&!(I<6||I===12))return hint('Món này không uống được');
 if(a==='drink'&&me.lvl<=0)return hint(I===12?'Tẩy chỉ có đá, đổ Sting vào đã (T)':'Hết sạch rồi, gọi thêm đi');
 if(a==='crack'&&I!==6&&I!==8)return hint('Chỉ cắn được hạt hướng dương hoặc lạc rang');
 if(a==='crack'&&me.lvl<=0)return hint('Hết sạch rồi, gọi thêm đi');
 if(a==='smash'&&!(I<6||I===12))return hint('Chỉ đập được cốc đồ uống thôi');
 if(a==='pour'){if(I!==12)return hint('Gọi tẩy đá ở menu và cầm trên tay mới đổ Sting vào được');if(me.bot<=0)return hint('Hết Sting rồi, gọi thêm chai');if(me.lvl>=4)return hint('Tẩy đầy rồi');return S({a})}
 if(a==='smoke'){if(I!==14)return hint('Gọi điếu cày thuốc lào ở menu trước');if(me.lvl<=0)return hint('Hết thuốc rồi');return S({a})}
